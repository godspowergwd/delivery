<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Delivery System — offline</title>
    <meta name="theme-color" content="#0b1120" />
    <style>
      html, body { height: 100%; margin: 0; background: radial-gradient(circle at 50% 20%, #16264a 0%, #0b1120 60%); color: #e2e8f0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 460px; margin: 0 auto; padding: 72px 24px; text-align: center; }
      img { width: 76px; height: 76px; margin-bottom: 20px; }
      h1 { font-size: 22px; margin: 0 0 10px; }
      p { color: #94a3b8; line-height: 1.6; font-size: 15px; }
      button { margin-top: 24px; width: 100%; padding: 16px; border: 0; border-radius: 18px; font-size: 16px; font-weight: 600; color: #04141a; background: linear-gradient(120deg, #5eead4, #22d3ee); }
      ul { text-align: left; color: #94a3b8; font-size: 14px; line-height: 1.7; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.svg" alt="Delivery System" />
      <h1>You are offline</h1>
      <p>
        The app is installed and cached on this device. Reconnect to send or update orders —
        anything already loaded stays available.
      </p>
      <ul>
        <li>Your cart is kept safely on this device.</li>
        <li>Cached orders and receipts remain readable.</li>
        <li>New orders need a connection to reach the kitchen.</li>
      </ul>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
