<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Maame’s Waakye App — offline</title>
    <meta name="theme-color" content="#e30613" />
    <style>
      html, body { height: 100%; margin: 0; background: #ffffff; color: #131a26; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 460px; margin: 0 auto; padding: 72px 24px; text-align: center; }
      img { width: 84px; height: 84px; margin-bottom: 20px; border-radius: 24px; box-shadow: 0 18px 40px -18px rgba(227, 6, 19, 0.55); }
      h1 { font-size: 22px; font-weight: 800; margin: 0 0 10px; letter-spacing: -0.01em; }
      p { color: #6a7383; line-height: 1.6; font-size: 15px; }
      button { margin-top: 24px; width: 100%; padding: 16px; border: 0; border-radius: 18px; font-size: 16px; font-weight: 600; color: #ffffff; background: #e30613; box-shadow: 0 8px 24px -8px rgba(227, 6, 19, 0.45); cursor: pointer; }
      ul { text-align: left; color: #6a7383; font-size: 14px; line-height: 1.7; }
    </style>
  </head>
  <body>
    <main>
      <img src="./brand/maame-waakye-onyx.png" alt="Maame’s Waakye App" />
      <h1>You are offline</h1>
      <p>
        The app is installed and cached on this device. Reconnect to send or update orders —
        anything already loaded stays available.
      </p>
      <ul>
        <li>Your cart is kept safely on this device.</li>
        <li>Cached orders and receipts remain readable.</li>
        <li>New orders need a connection to reach the kitchen.</li>
      </ul>
      <button type="button" onclick="window.location.reload()">Reconnect to ONYX</button>
    </main>
  </body>
</html>
