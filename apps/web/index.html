<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <title>Maame’s Waakye App — ONYX Delivery</title>
    <meta name="description" content="Maame’s Waakye App — hot waakye and rice meals delivered around Malam & Gbawe, Accra." />
    <meta name="theme-color" content="#e30613" />
    <link rel="icon" href="%BASE_URL%brand/maame-waakye-onyx.png" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon-180x180.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <!-- Installable, full-screen standalone experience -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Maame’s Waakye" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="Maame’s Waakye App" />
    <meta name="msapplication-TileColor" content="#e30613" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-startup-image" href="/apple-splash-2048-2732.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1668-2388.png" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1536-2048.png" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1290-2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1179-2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1170-2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1125-2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-828-1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-750-1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

    <style>
      /* Returns to a white canvas immediately: no white flash, no dark shell.
         The splash below is painted by plain HTML so the very first frame is
         already branded, and the ONYX logo sits inside a soft red glow. */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background-color: #ffffff;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 22px;
        background: #ffffff;
        color: #131a26;
        font-family: "Inter var", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        z-index: 9999;
        transition: opacity 320ms var(--ease-premium);
      }
      #boot-splash .glow {
        position: relative;
        display: grid;
        place-items: center;
        width: 168px;
        height: 168px;
      }
      #boot-splash .glow::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(227, 6, 19, 0.22) 0%, rgba(227, 6, 19, 0) 68%);
        animation: boot-breathe 2.6s ease-in-out infinite;
      }
      #boot-splash img {
        position: relative;
        width: 92px;
        height: 92px;
        border-radius: 26px;
        box-shadow: 0 18px 40px -18px rgba(227, 6, 19, 0.55);
        animation: boot-in 620ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #boot-splash .word {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: #131a26;
        animation: boot-in 700ms 80ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #boot-splash .track {
        position: relative;
        width: 132px;
        height: 4px;
        border-radius: 999px;
        background: #f1f3f7;
        overflow: hidden;
        animation: boot-in 700ms 160ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #boot-splash .track::after {
        content: "";
        position: absolute;
        inset-block: 0;
        width: 42%;
        border-radius: 999px;
        background: linear-gradient(90deg, #e30613, #f5253a);
        animation: boot-progress 1.25s ease-in-out infinite;
      }
      @keyframes boot-in {
        from { opacity: 0; transform: translateY(12px) scale(0.96); }
        to { opacity: 1; transform: none; }
      }
      @keyframes boot-breathe {
        0%, 100% { transform: scale(0.92); opacity: 0.75; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @keyframes boot-progress {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(320%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .glow::before,
        #boot-splash img,
        #boot-splash .word,
        #boot-splash .track,
        #boot-splash .track::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite">
      <span class="glow"><img src="%BASE_URL%brand/maame-waakye-onyx.png" alt="Maame’s Waakye App" /></span>
      <span class="word">MAAME’S WAAKYE</span>
      <span class="track" aria-hidden="true"></span>
    </div>
    <script>
      // Fallback that runs even if the app bundle fails to load or hangs:
      // the boot splash must never stay on screen forever. The app itself
      // removes the splash much earlier (src/lib/boot-splash.ts).
      (function () {
        var splash = document.getElementById('boot-splash');
        if (!splash) return;
        var gone = false;
        var dismiss = function () {
          if (gone) return;
          gone = true;
          try {
            splash.style.transition = 'opacity 180ms ease-out';
            splash.style.opacity = '0';
            window.setTimeout(function () { splash.remove(); }, 220);
          } catch (e) {
            splash.remove();
          }
        };
        window.setTimeout(dismiss, 8000);
        window.addEventListener('error', dismiss);
      })();
    </script>
    <div id="root"></div>
    <noscript>
      <p style="color: #e2e8f0; font-family: system-ui, sans-serif; padding: 24px">
        Maame’s Waakye App needs JavaScript enabled to run.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
