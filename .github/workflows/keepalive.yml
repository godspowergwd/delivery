name: Keep the API awake

# Render suspends a free service after ~15 minutes without traffic. The next
# request - a sign-in, for example - then waits for a full cold start, which is
# the usual cause of "login takes minutes". This scheduled ping keeps the API
# warm so sign-in stays instant.
#
# Update the URL below if the Render service URL ever changes.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-api-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      API_URL: https://delivery-2xbo.onrender.com/api/health
    steps:
      - name: Ping the API health endpoint
        run: |
          # A sleeping Render service needs up to ~60s to wake, so attempts are
          # patient and back off. The job fails only if all attempts fail.
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 45 \
                 -o /tmp/health.json -w "attempt $attempt: HTTP %{http_code} in %{time_total}s\n" "$API_URL"; then
              cat /tmp/health.json; echo
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::error::API did not return HTTP 200 after 5 attempts"
          exit 1
